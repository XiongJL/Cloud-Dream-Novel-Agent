name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.11.32
  UV_LINK_MODE: copy

jobs:
  python-runtime:
    name: Python Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync frozen Python environment
        run: uv sync --frozen --project agent_runtime --extra dev

      - name: Test Python Runtime
        run: uv run --frozen --project agent_runtime --extra dev pytest -q agent_runtime

  desktop:
    name: Desktop contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install -g pnpm@8.15.9

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Build Core and Prisma client
        run: pnpm run build:core

      - name: Test Desktop Agent contracts
        run: pnpm --filter novel-editor-desktop run test:agent-recovery

      - name: Type-check Desktop
        run: pnpm --filter novel-editor-desktop run typecheck

      - name: Build Renderer, Main, and Preload
        run: pnpm --dir apps/desktop exec vite build
