name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  UV_VERSION: 0.11.32
  UV_LINK_MODE: copy

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require an existing version tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "Release tag does not exist on origin: $RELEASE_TAG" >&2
            exit 1
          }

  build-windows:
    name: Build Windows x64
    needs: validate-release
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Sync package versions from tag
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $env:VERSION = $version
          node -e "const fs=require('fs'); for (const file of ['package.json','apps/desktop/package.json']) { const data=JSON.parse(fs.readFileSync(file,'utf8')); data.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(data,null,2)+'\n'); }"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install -g pnpm@8.15.9

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==$env:UV_VERSION"

      - name: Sync frozen Python environment
        run: uv sync --frozen --project agent_runtime --extra dev --extra build

      - name: Install JavaScript dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              throw "pnpm install failed after 3 attempts"
            }
            Start-Sleep -Seconds ($attempt * 15)
          }

      - name: Test Python Runtime
        run: uv run --frozen --project agent_runtime --extra dev --extra build pytest -q agent_runtime

      - name: Build Core and Prisma client
        run: pnpm run build:core

      - name: Test Desktop Agent contracts
        run: pnpm --filter novel-editor-desktop run test:agent-recovery

      - name: Build Windows artifacts
        run: pnpm --filter novel-editor-desktop run build:win

      - name: Smoke-test packaged Windows Runtime
        shell: pwsh
        run: |
          $binary = "apps/desktop/release/win-unpacked/resources/agent-runtime/novel-agent-runtime.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Packaged Agent runtime missing: $binary"
          }
          python agent_runtime/scripts/smoke_runtime.py --binary $binary

      - name: Stage Windows release assets
        id: stage
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $stageDir = Join-Path $env:RUNNER_TEMP "release-upload-windows"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          $files = Get-ChildItem apps/desktop/release -File | Where-Object {
            $_.Name -like '*Setup-*.exe' -or
            $_.Name -like '*Portable-*.exe' -or
            $_.Name -like '*Setup-*.exe.blockmap'
          }
          foreach ($file in $files) {
            $targetName = switch -Wildcard ($file.Name) {
              '*Setup-*.exe.blockmap' { "clouddream-novel-agent-setup-$version.exe.blockmap"; break }
              '*Setup-*.exe' { "clouddream-novel-agent-setup-$version.exe"; break }
              '*Portable-*.exe' { "clouddream-novel-agent-portable-$version.exe"; break }
              default { throw "Unexpected Windows asset: $($file.Name)" }
            }
            Copy-Item $file.FullName (Join-Path $stageDir $targetName) -Force
          }
          if (-not (Get-ChildItem $stageDir -File)) {
            throw "No Windows release assets found."
          }
          "path=$stageDir" >> $env:GITHUB_OUTPUT

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ steps.stage.outputs.path }}/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            machine: x86_64
          - arch: arm64
            runner: macos-15
            machine: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}" || {
            echo "Expected ${{ matrix.machine }}, got $(uname -m)" >&2
            exit 1
          }

      - name: Sync package versions from tag
        run: |
          version="${RELEASE_TAG#v}"
          VERSION="$version" node <<'NODE'
          const fs = require('fs');
          for (const file of ['package.json', 'apps/desktop/package.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install -g pnpm@8.15.9

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync frozen Python environment
        run: uv sync --frozen --project agent_runtime --extra dev --extra build

      - name: Install JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Test Python Runtime
        run: uv run --frozen --project agent_runtime --extra dev --extra build pytest -q agent_runtime

      - name: Build Core and Prisma client
        run: pnpm run build:core

      - name: Test Desktop Agent contracts
        run: pnpm --filter novel-editor-desktop run test:agent-recovery

      - name: Build macOS artifact
        run: pnpm --filter novel-editor-desktop run build:mac:${{ matrix.arch }}

      - name: Smoke-test packaged macOS Runtime
        run: |
          binary="$(find apps/desktop/release -type f -path '*/Contents/Resources/agent-runtime/novel-agent-runtime' -print -quit)"
          test -n "$binary" || { echo "Packaged Agent runtime missing" >&2; exit 1; }
          python agent_runtime/scripts/smoke_runtime.py --binary "$binary"

      - name: Stage macOS release assets
        id: stage
        run: |
          shopt -s nullglob
          version="${RELEASE_TAG#v}"
          arch="${{ matrix.arch }}"
          stage_dir="${RUNNER_TEMP}/release-upload-macos-${arch}"
          mkdir -p "$stage_dir"
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.dmg.blockmap apps/desktop/release/*.zip)
          for file in "${files[@]}"; do
            case "$(basename "$file")" in
              *.dmg.blockmap) target_name="clouddream-novel-agent-mac-${arch}-${version}.dmg.blockmap" ;;
              *.dmg) target_name="clouddream-novel-agent-mac-${arch}-${version}.dmg" ;;
              *.zip) target_name="clouddream-novel-agent-mac-${arch}-${version}.zip" ;;
              *) echo "Unexpected macOS asset: $file" >&2; exit 1 ;;
            esac
            cp "$file" "$stage_dir/$target_name"
          done
          compgen -G "$stage_dir/*" >/dev/null || { echo "No macOS release assets found" >&2; exit 1; }
          echo "path=$stage_dir" >> "$GITHUB_OUTPUT"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.path }}/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          mapfile -d '' files < <(find release-assets -type f -print0)
          test ${#files[@]} -gt 0 || { echo "No verified release assets found" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
