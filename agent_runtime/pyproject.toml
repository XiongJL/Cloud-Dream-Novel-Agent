[project]
name = "novel-agent-runtime"
version = "0.1.0"
description = "Python Agent Runtime for CloudDream Novel Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "langgraph==1.2.8",
    "langgraph-checkpoint-sqlite==3.1.0",
    "fastmcp==3.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]
build = [
    "pyinstaller==6.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
